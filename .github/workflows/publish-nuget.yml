name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    name: Build and Publish NuGet Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          # Validate semantic versioning format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must follow semantic versioning format (X.Y.Z)"
            echo "Provided: $VERSION"
            exit 1
          fi
        else
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF#refs/tags/v}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Update project version
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Create backup and update version
        cp EvokerEngine.Core/EvokerEngine.Core.csproj EvokerEngine.Core/EvokerEngine.Core.csproj.bak
        sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" EvokerEngine.Core/EvokerEngine.Core.csproj
        
        # Verify the update was successful
        if grep -q "<Version>$VERSION</Version>" EvokerEngine.Core/EvokerEngine.Core.csproj; then
          echo "✓ Version updated successfully to $VERSION"
          grep "<Version>" EvokerEngine.Core/EvokerEngine.Core.csproj | head -1
        else
          echo "Error: Failed to update version in .csproj file"
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack NuGet package
      run: dotnet pack EvokerEngine.Core/EvokerEngine.Core.csproj --configuration Release --no-build --output ./nupkg

    - name: List package contents
      run: |
        echo "Created package:"
        ls -lh ./nupkg/

    - name: Publish to NuGet repository
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        # Publish package (API key is passed via environment variable for security)
        dotnet nuget push ./nupkg/*.nupkg \
          --source https://repo.evokerking.dev/repository/nuget-hosted/ \
          --api-key "$NUGET_API_KEY" \
          --skip-duplicate
        
        if [ $? -eq 0 ]; then
          echo "✓ Package published successfully or already exists"
        else
          echo "✗ Failed to publish package"
          exit 1
        fi

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./nupkg/*.nupkg
        retention-days: 30
